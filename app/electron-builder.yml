appId: com.eatsleepcode.screenshot
productName: Device Screenshot Tool
# ${productName} (used in the default artifactName template) contains
# spaces; electron-builder writes a hyphen-sanitized filename into
# latest.yml/latest-linux.yml but otherwise names the actual output file
# with real spaces. That's fine when electron-builder itself uploads the
# release (it uploads under the sanitized name to match), but our CI
# publishes with a plain `gh release create` instead (see build.yml — one
# electron-builder process per OS can't safely publish to the same GitHub
# release), and GitHub silently mangles spaces in uploaded asset names to
# dots — neither the raw-spaces name nor GitHub's dotted name matches what
# latest.yml points to, so electron-updater can't find the asset. ${name}
# is package.json's name, already hyphenated, so there's nothing to mangle.
artifactName: ${name}-${version}.${ext}
directories:
  buildResources: resources
  output: dist
files:
  - out/**/*
  - package.json
asarUnpack:
  - node_modules/playwright/**
  - node_modules/playwright-core/**
extraResources:
  - from: data/presets.json
    to: presets.json
win:
  target:
    - nsis
  # Requires a Windows code-signing certificate — unsigned builds show a
  # SmartScreen warning. See CLAUDE.md open items.
mac:
  target:
    - dmg
  category: public.app-category.developer-tools
  hardenedRuntime: true
  gatekeeperAssess: false
  # Requires an Apple Developer ID + notarization credentials in env vars
  # (APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID). See CLAUDE.md open items.
linux:
  target:
    - AppImage
  category: Development
  syncDesktopName: true
publish:
  provider: github
  owner: eat-sleep-code
  repo: screenshot.eat-sleep-code.com
  # electron-builder defaults releaseType to "draft". The download site
  # reads GitHub's /releases/latest endpoint, which never returns drafts
  # or prereleases (even to the owner, unauthenticated) — so a draft
  # release silently never shows up there. Publish immediately instead.
  # (Note: GithubOptions has no separate draft/prerelease booleans —
  # only this one releaseType enum; additionalProperties is false on
  # this schema, so any other key name fails validation entirely.)
  releaseType: release
