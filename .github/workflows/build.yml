name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  # Runs on every push/PR: installs and does an electron-vite build only, no
  # packaging. Fast, and catches the kind of thing a clean install can
  # surface that a locally-cached node_modules won't (see git history for
  # a real example of this happening).
  verify:
    name: Build check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm install
        env:
          # Browsers are downloaded at app first-run, not build time (see
          # src/main/browsers.js) — skip Playwright's own postinstall
          # download so CI doesn't pull ~1GB of Chromium/WebKit for nothing.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      - run: npm run build

  # Every push to main gets its own release — no `git tag` step needed.
  # Version is YYYY.M.D-H (UTC, unpadded month/day/hour, e.g. 2026.9.23-14):
  # a bare 4th dot segment isn't valid semver (electron-builder enforces
  # this — see git history for the leading-zero version this same
  # constraint already caught once), so the hour rides as semver
  # prerelease metadata after a hyphen instead of a 4th dot segment.
  # Two pushes in the same UTC hour intentionally produce the same
  # version/tag — the second just overwrites the first's release.
  version:
    name: Compute version
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.compute.outputs.version }}
      tag: ${{ steps.compute.outputs.tag }}
    steps:
      - name: Compute version
        id: compute
        run: |
          VERSION="$(date -u +'%Y.%-m.%-d-%-H')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

  # Packages a native installer per OS and publishes it to this repo's
  # GitHub Releases (electron-updater reads from there, and the download
  # site at /docs links to whatever /releases/latest returns).
  #
  # Code signing is optional here: electron-builder skips it when the
  # matching secrets aren't set, producing an unsigned build (OS security
  # warnings on install) rather than failing. Add these repo secrets once
  # Jeff supplies certificates (see CLAUDE.md "Open items"):
  #   WIN_CSC_LINK / WIN_CSC_KEY_PASSWORD           — Windows .pfx, base64-encoded, + its password
  #   MAC_CSC_LINK / MAC_CSC_KEY_PASSWORD           — Apple Developer ID .p12, base64-encoded, + its password
  #   APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID — for notarization
  package:
    name: Package (${{ matrix.os }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          # macOS build disabled until we have an Apple Developer account —
          # uncomment once MAC_CSC_LINK/MAC_CSC_KEY_PASSWORD and the
          # APPLE_* notarization secrets are set up (see CLAUDE.md "Open items").
          # - os: macos-latest
          #   target: --mac
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm install
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      - run: npm run build

      - name: Package and publish
        # extraMetadata.version overrides package.json's version for this
        # build/publish only — nothing gets committed back to the repo.
        run: npx electron-builder ${{ matrix.target }} --publish always -c.extraMetadata.version=${{ needs.version.outputs.version }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ matrix.os == 'windows-latest' && secrets.WIN_CSC_LINK || matrix.os == 'macos-latest' && secrets.MAC_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.os == 'windows-latest' && secrets.WIN_CSC_KEY_PASSWORD || matrix.os == 'macos-latest' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

  # With a release published on every push, the Releases page would
  # otherwise accumulate one entry per commit forever. Once this push's
  # release is up (both OS legs done), unpublish every other release —
  # i.e. flip it to draft, not delete it — so /releases/latest (and the
  # download site) only ever sees today's-push-this-hour as "latest",
  # while older builds/assets stay around, just hidden from the public list.
  cleanup:
    name: Unpublish prior releases
    needs: [version, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Unpublish everything except this push's release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEEP_TAG: ${{ needs.version.outputs.tag }}
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName,isDraft \
            --jq ".[] | select(.tagName != \"$KEEP_TAG\" and .isDraft == false) | .tagName" |
          while read -r tag; do
            echo "Unpublishing $tag"
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft
          done
