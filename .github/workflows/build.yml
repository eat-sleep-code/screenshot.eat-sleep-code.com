name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  # Runs on every push/PR: installs and does an electron-vite build only, no
  # packaging. Fast, and catches the kind of thing a clean install can
  # surface that a locally-cached node_modules won't (see git history for
  # a real example of this happening).
  verify:
    name: Build check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm install
        env:
          # Browsers are downloaded at app first-run, not build time (see
          # src/main/browsers.js) — skip Playwright's own postinstall
          # download so CI doesn't pull ~1GB of Chromium/WebKit for nothing.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      - run: npm run build

  # Every push to main gets its own release — no `git tag` step needed.
  # Version is YYYY.M.PPPPPP (UTC, unpadded month), e.g. 2026.9.232326 for
  # Sep 23 at 23:26. PPPPPP is day*10000 + hour*100 + minute as plain
  # arithmetic (not text concatenation, which could reintroduce a leading
  # zero — semver numeric identifiers can't start with one), folded into
  # the patch number rather than a separate dot/hyphen segment: day
  # dominates, so it's still strictly increasing through the month, and it
  # resets (with minor bumping) each month.
  #
  # This deliberately avoids a `-` prerelease suffix (e.g. "2026.9.23-2326"),
  # even though that's otherwise valid semver and was tried first — DO NOT
  # go back to it. electron-updater's GitHub provider treats any
  # non-"alpha"/"beta" semver prerelease identifier as a custom release
  # "channel" scoped to just that identifier (see getLatestVersion() in
  # electron-updater/out/providers/GitHubProvider.js): since every build's
  # prerelease id is unique to itself (e.g. "2326"), it only ever matches
  # the running app's own release, never a newer one, and 404s once that
  # release gets unpublished by the cleanup job below. A plain
  # MAJOR.MINOR.PATCH release (no prerelease/build segment) sidesteps this
  # entirely and resolves the real latest release normally. Two pushes in
  # the same UTC minute intentionally produce the same version/tag — the
  # second just overwrites the first's release.
  version:
    name: Compute version
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.compute.outputs.version }}
      tag: ${{ steps.compute.outputs.tag }}
    steps:
      - name: Compute version
        id: compute
        run: |
          DAY=$(date -u +'%-d')
          HOUR=$(date -u +'%-H')
          MINUTE=$(date -u +'%-M')
          PATCH=$((DAY * 10000 + HOUR * 100 + MINUTE))
          VERSION="$(date -u +'%Y.%-m').$PATCH"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

  # Packages a native installer per OS. Builds only — does NOT publish.
  # electron-builder's GitHub publisher creates the release as a draft and
  # only converts it to a real, tagged release as a finalization step once
  # it's done uploading; running that concurrently from two matrix legs
  # (Windows + Linux, both targeting the same tag) is a race, and it's a
  # race neither leg reliably wins — both drafts merge into one release
  # object, but nothing ever flips it out of "draft", so it's left sitting
  # under a throwaway "untagged-*" URL that electron-updater 404s against
  # (see git history for a real release this happened to). Publishing is
  # done once, serialized, in the `publish` job below instead.
  #
  # Code signing is optional here: electron-builder skips it when the
  # matching secrets aren't set, producing an unsigned build (OS security
  # warnings on install) rather than failing. Add these repo secrets once
  # Jeff supplies certificates (see CLAUDE.md "Open items"):
  #   WIN_CSC_LINK / WIN_CSC_KEY_PASSWORD           — Windows .pfx, base64-encoded, + its password
  #   MAC_CSC_LINK / MAC_CSC_KEY_PASSWORD           — Apple Developer ID .p12, base64-encoded, + its password
  #   APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID — for notarization
  package:
    name: Package (${{ matrix.os }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          # macOS build disabled until we have an Apple Developer account —
          # uncomment once MAC_CSC_LINK/MAC_CSC_KEY_PASSWORD and the
          # APPLE_* notarization secrets are set up (see CLAUDE.md "Open items").
          # - os: macos-latest
          #   target: --mac
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm install
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      - run: npm run build

      - name: Package
        # --config.extraMetadata.version overrides package.json's version
        # for this build only — nothing gets committed back to the repo.
        # Use the full "--config." form, not the "-c." short alias: on the
        # Windows runner, "-c.extraMetadata.version=X" was parsed as -c
        # (config) taking the literal string ".extraMetadata.version=X" as
        # a file path, which then failed with ENOENT.
        run: npx electron-builder ${{ matrix.target }} --publish never --config.extraMetadata.version=${{ needs.version.outputs.version }}
        env:
          CSC_LINK: ${{ matrix.os == 'windows-latest' && secrets.WIN_CSC_LINK || matrix.os == 'macos-latest' && secrets.MAC_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.os == 'windows-latest' && secrets.WIN_CSC_KEY_PASSWORD || matrix.os == 'macos-latest' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Upload build as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: |
            app/dist/*.exe
            app/dist/*.exe.blockmap
            app/dist/*.AppImage
            app/dist/*.AppImage.blockmap
            app/dist/latest*.yml
          if-no-files-found: error
          retention-days: 1

  # Publishes every platform's build to a single GitHub release, in one
  # serialized job — see the `package` job above for why this can't be done
  # per matrix leg.
  publish:
    name: Publish release
    needs: [version, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all platform builds
        uses: actions/download-artifact@v5
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ needs.version.outputs.tag }}" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "${{ needs.version.outputs.tag }}" \
            --notes "Automated build from ${{ github.sha }}."

  # With a release published on every push, the Releases page would
  # otherwise accumulate one entry per commit forever. Once this push's
  # release is up (both OS legs done), unpublish every other release —
  # i.e. flip it to draft, not delete it — so /releases/latest (and the
  # download site) only ever sees today's-push-this-hour as "latest",
  # while older builds/assets stay around, just hidden from the public list.
  cleanup:
    name: Unpublish prior releases
    needs: [version, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Unpublish everything except this push's release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEEP_TAG: ${{ needs.version.outputs.tag }}
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName,isDraft \
            --jq ".[] | select(.tagName != \"$KEEP_TAG\" and .isDraft == false) | .tagName" |
          while read -r tag; do
            echo "Unpublishing $tag"
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft
          done
